
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Perulangan FOR JavaScript</title>
</head>
<body>

    <h2>Program Perulangan FOR</h2>

    <label>Masukkan angka:</label>
    <input type="number" id="angka" placeholder="Masukkan angka">

    <button onclick="tampilkanAngka()">Tampilkan</button>

    <p id="hasil"></p>

    <script>
        function tampilkanAngka() {
            let angka = Number(document.getElementById("angka").value);
            let hasil = "";

            if (
                document.getElementById("angka").value === "" ||
                !Number.isInteger(angka) ||
                angka < 1 ||
                angka > 1000
            ) {
                document.getElementById("hasil").innerHTML =
                    "Masukkan angka bulat dari 1 sampai 1000!";
                return;
            }

            for (let i = 1; i <= angka; i++) {
                hasil += i + "<br>";
            }

            document.getElementById("hasil").innerHTML =
                "<b>Hasil Perulangan:</b><br>" + hasil;
        }
    </script>

</body>
</html>
